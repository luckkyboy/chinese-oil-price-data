name: daily-fetch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "30 16,20,0,4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD. If omitted, catch up the latest incomplete window due by yesterday in Asia/Shanghai."
        required: false
        type: string

jobs:
  decide:
    runs-on: [self-hosted, oilprice]
    permissions:
      contents: write
    outputs:
      target_date: ${{ steps.decide.outputs.target_date }}
      mode: ${{ steps.decide.outputs.mode }}
      reason: ${{ steps.decide.outputs.reason }}
      summary_path: ${{ steps.decide.outputs.summary_path }}
      provinces_missing: ${{ steps.decide.outputs.provinces_missing }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Decision logic and the NDRC news release check use the standard library.
      # Both adjustment and no-change decisions are persisted for later runs.
      - name: Decide fetch mode
        id: decide
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from oilprice.workflow_decision import decide_fetch_for_repository

          # Canonical dispatch validation is performed with date.fromisoformat
          # inside the imported decision module.
          decision = decide_fetch_for_repository(
              Path.cwd(),
              requested_date=os.environ.get("DATE_INPUT", ""),
          )
          outputs = decision.as_outputs()

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Commit and push calendar decisions
        env:
          TARGET_DATE: ${{ steps.decide.outputs.target_date }}
        run: |
          if ! git diff --quiet -- data/calendar; then
            python -m pip install -r requirements-core.txt
            python -m oilprice.cli validate-json
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add data/calendar
            git commit -m "actions:oilprice:update ${TARGET_DATE} calendar decision"
            git push
          fi

      - name: Write workflow summary
        if: always()
        env:
          TARGET_DATE: ${{ steps.decide.outputs.target_date || 'unknown' }}
          FETCH_MODE: ${{ steps.decide.outputs.mode || 'failed' }}
          FETCH_REASON: ${{ steps.decide.outputs.reason || 'unknown' }}
          PROVINCES_MISSING: ${{ steps.decide.outputs.provinces_missing || '' }}
        run: |
          printf '%s\n' "### Daily Oil Price Workflow" >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- target_date: ${TARGET_DATE}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- mode: ${FETCH_MODE}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- reason: ${FETCH_REASON}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- provinces_missing: ${PROVINCES_MISSING}" >> "$GITHUB_STEP_SUMMARY"

  fetch:
    needs: decide
    if: needs.decide.outputs.mode != 'skip'
    runs-on: [self-hosted, oilprice]
    permissions:
      contents: write
    env:
      DISABLE_MODEL_SOURCE_CHECK: "True"
      PYTHONUNBUFFERED: "1"
      CLOAKBROWSER_BINARY_PATH: /runner-data/binary/cloakbrowser/chrome
      PADDLE_PDX_CACHE_HOME: /runner-data/binary/paddlex-models
      TARGET_DATE: ${{ needs.decide.outputs.target_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Include the calendar commit just pushed by the decide job.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full extract
        if: needs.decide.outputs.mode == 'force'
        timeout-minutes: 30
        run: |
          python -m oilprice.cli extract "$TARGET_DATE" --force --timeout 90

      - name: Retry missing provinces
        if: needs.decide.outputs.mode == 'missing'
        timeout-minutes: 30
        run: |
          python -m oilprice.cli extract "$TARGET_DATE" --timeout 90

      - name: Validate generated data contracts
        run: python -m oilprice.cli validate-json

      - name: Commit and push price data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/prices
          if ! git diff --cached --quiet; then
            git commit -m "actions:oilprice:update ${TARGET_DATE} prices"
            git push
          else
            echo "No changes to publish"
          fi
