name: daily-fetch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "30 16,20,0,4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD. If omitted, catch up the latest incomplete window due by yesterday in Asia/Shanghai."
        required: false
        type: string

jobs:
  fetch:
    runs-on: [self-hosted, oilprice]
    permissions:
      contents: write
    env:
      DISABLE_MODEL_SOURCE_CHECK: "True"
      PYTHONUNBUFFERED: "1"
      CLOAKBROWSER_BINARY_PATH: /runner-data/binary/cloakbrowser/chrome
      PADDLE_PDX_CACHE_HOME: /runner-data/binary/paddlex-models
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Decide fetch mode
        id: decide
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from oilprice.workflow_decision import decide_fetch_for_repository

          # Canonical dispatch validation is performed with date.fromisoformat
          # inside the imported decision module.
          decision = decide_fetch_for_repository(
              Path.cwd(),
              requested_date=os.environ.get("DATE_INPUT", ""),
          )
          outputs = decision.as_outputs()

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Warm up PaddleOCR
        if: steps.decide.outputs.mode != 'skip'
        run: |
          python - <<'PY'
          from paddleocr import PaddleOCR

          PaddleOCR(
              lang="ch",
              ocr_version="PP-OCRv5",
              use_doc_orientation_classify=False,
              use_doc_unwarping=False,
              use_textline_orientation=False,
          )
          PY

      - name: Run full extract
        if: steps.decide.outputs.mode == 'force'
        timeout-minutes: 30
        env:
          TARGET_DATE: ${{ steps.decide.outputs.target_date }}
        run: |
          python -m oilprice.cli extract "$TARGET_DATE" --force --timeout 90

      - name: Retry missing provinces
        if: steps.decide.outputs.mode == 'missing'
        timeout-minutes: 30
        env:
          TARGET_DATE: ${{ steps.decide.outputs.target_date }}
        run: |
          python -m oilprice.cli extract "$TARGET_DATE" --timeout 90

      - name: Validate generated data contracts
        if: steps.decide.outputs.mode != 'skip'
        run: python -m oilprice.cli validate-json

      - name: Commit and push price data
        if: steps.decide.outputs.mode != 'skip'
        env:
          TARGET_DATE: ${{ steps.decide.outputs.target_date }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/prices
          if ! git diff --cached --quiet; then
            git commit -m "actions:oilprice:update ${TARGET_DATE} prices"
            git push
          else
            echo "No changes to publish"
          fi

      - name: Write workflow summary
        if: always()
        env:
          TARGET_DATE: ${{ steps.decide.outputs.target_date || 'unknown' }}
          FETCH_MODE: ${{ steps.decide.outputs.mode || 'failed' }}
          FETCH_REASON: ${{ steps.decide.outputs.reason || 'unknown' }}
          PROVINCES_MISSING: ${{ steps.decide.outputs.provinces_missing || '' }}
        run: |
          printf '%s\n' "### Daily Oil Price Workflow" >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- target_date: ${TARGET_DATE}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- mode: ${FETCH_MODE}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- reason: ${FETCH_REASON}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- provinces_missing: ${PROVINCES_MISSING}" >> "$GITHUB_STEP_SUMMARY"
