name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install quality dependency
        run: python -m pip install -r requirements-core.txt

      - name: Compile Python
        run: python -m compileall -q oilprice script tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON data contracts
        run: python -m oilprice.cli validate-json
