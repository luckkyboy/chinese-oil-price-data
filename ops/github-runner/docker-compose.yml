services:
  oilprice-runner:
    build:
      context: .
    restart: unless-stopped
    environment:
      GH_REPOSITORY_URL: ${GH_REPOSITORY_URL}
      GH_RUNNER_TOKEN: ${GH_RUNNER_TOKEN}
      GH_RUNNER_NAME: ${GH_RUNNER_NAME:-oilprice-runner-1}
      GH_RUNNER_LABELS: ${GH_RUNNER_LABELS:-oilprice}
      RUNNER_VERSION: ${RUNNER_VERSION:-2.334.0}
      TZ: Asia/Shanghai
      DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - runner-data:/runner-data
    shm_size: 500m

volumes:
  runner-data:
